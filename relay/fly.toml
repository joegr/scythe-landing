app = "scythe-signup"
primary_region = "iad"

[env]
  SIGNUPS_REPO = "joegr/scythe-signups"
  ALLOWED_ORIGINS = "https://joegr.github.io,http://localhost:8137"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero between signups; the first request after idle takes a second or two.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "60s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
